included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - Package.swift

disabled_rules:
  - todo
  - blanket_disable_command
  - opening_brace

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - toggle_bool
  - trailing_comma
  - implicit_return

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 60
  error: 100

function_parameter_count:
  warning: 7
  error: 10

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50

nesting:
  type_level: 2
  function_level: 3

trailing_comma:
  mandatory_comma: true
