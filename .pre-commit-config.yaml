exclude: '\.build|\.swiftpm|\.app'
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      # linter
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --quiet --force-exclude
        language: system
        types: [swift]
      # formatter
      - id: swiftformat
        name: SwiftFormat
        entry: swiftformat
        language: system
        types: [swift]
